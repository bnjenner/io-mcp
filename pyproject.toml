[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "io-mcp"
version = "0.1.0"
description = "Local Research & Homelab Assistant Toolkit (MCP server + CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
io-mcp = "io_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["io_mcp*"]

# NOTE: prompt files live at the repo root (prompts/) and are loaded at runtime
# relative to the source tree, so io-mcp must be installed *editable* (pip
# install -e .) — which deploy/install.sh does. See deploy/README.md.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
